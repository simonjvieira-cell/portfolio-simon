<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página não encontrada · Simon Benlulu</title>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6V8Q8Z7C33"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-6V8Q8Z7C33');</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236D1717'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' fill='white'>SB</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#F8F6F2;--t1:#0E0D0B;--t2:#494743;--t3:#9A9790;--red:#6D1717;--red-dim:rgba(109,23,23,.07);--border:rgba(14,13,11,.09)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--bg);color:var(--t1);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;-webkit-font-smoothing:antialiased}

    /* ASTRONAUT */
    .astronaut{width:160px;height:160px;position:relative;margin:0 auto 2.5rem;animation:float 4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}

    /* Body */
    .a-body{position:absolute;width:90px;height:110px;background:#fff;border-radius:50% 50% 45% 45%;border:3px solid #ddd;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:inset 0 -8px 16px rgba(0,0,0,.06)}
    /* Helmet */
    .a-helmet{position:absolute;width:72px;height:72px;background:linear-gradient(135deg,#e8f4ff 30%,#c5dff5);border-radius:50%;border:3px solid #ddd;left:50%;top:18%;transform:translateX(-50%);box-shadow:inset -6px -6px 12px rgba(0,0,0,.08),0 0 0 4px #f0f0f0}
    /* Visor */
    .a-visor{position:absolute;width:42px;height:34px;background:linear-gradient(145deg,#1a3a5c,#2c5f8a);border-radius:50%;left:50%;top:28%;transform:translateX(-50%);overflow:hidden}
    .a-visor::after{content:'';position:absolute;width:12px;height:8px;background:rgba(255,255,255,.35);border-radius:50%;top:6px;left:8px}
    /* Arms */
    .a-arm-l,.a-arm-r{position:absolute;width:22px;height:55px;background:#fff;border:3px solid #ddd;border-radius:12px;top:52%}
    .a-arm-l{left:8%;transform:rotate(25deg);transform-origin:top center;animation:wave 2s ease-in-out infinite}
    .a-arm-r{right:8%;transform:rotate(-15deg);transform-origin:top center}
    @keyframes wave{0%,100%{transform:rotate(25deg)}50%{transform:rotate(50deg)}}
    /* Legs */
    .a-leg-l,.a-leg-r{position:absolute;width:22px;height:40px;background:#fff;border:3px solid #ddd;border-radius:0 0 10px 10px;bottom:2%;transform-origin:top center}
    .a-leg-l{left:28%;transform:rotate(8deg)}
    .a-leg-r{right:28%;transform:rotate(-8deg)}
    /* Backpack */
    .a-pack{position:absolute;width:30px;height:38px;background:#e0e0e0;border:2px solid #ccc;border-radius:6px;right:12%;top:50%;transform:translateY(-50%)}
    /* Stars */
    .stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
    .star{position:absolute;background:var(--t3);border-radius:50%;animation:twinkle var(--d) ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.6}}

    .content{position:relative;z-index:1}
    .num{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(5rem,18vw,9rem);line-height:.9;letter-spacing:-.04em;color:var(--red);opacity:.15;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;z-index:0}
    .title{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(1.5rem,4vw,2.25rem);letter-spacing:-.02em;color:var(--t1);margin-bottom:.75rem;position:relative;z-index:1}
    .sub{font-size:.9375rem;color:var(--t2);line-height:1.7;max-width:380px;margin:0 auto 2.5rem;position:relative;z-index:1}
    .sub em{font-style:italic;color:var(--t3)}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.7rem 1.5rem;border-radius:7px;font-size:.875rem;font-weight:600;background:var(--red);color:#fff;text-decoration:none;transition:transform .2s,box-shadow .2s;position:relative;z-index:1}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(109,23,23,.25)}
    .sig{position:fixed;bottom:1.5rem;font-size:.75rem;color:var(--t3);letter-spacing:.04em}
  </style>
</head>
<body>

  <!-- Estrelas de fundo -->
  <div class="stars" id="stars"></div>

  <!-- Astronauta -->
  <div class="astronaut">
    <div class="a-body"></div>
    <div class="a-helmet"><div class="a-visor"></div></div>
    <div class="a-arm-l"></div>
    <div class="a-arm-r"></div>
    <div class="a-leg-l"></div>
    <div class="a-leg-r"></div>
    <div class="a-pack"></div>
  </div>

  <div class="content" style="position:relative">
    <div class="num">404</div>
    <h1 class="title">Essa página foi pro espaço.</h1>
    <p class="sub">Parece que o link que você seguiu não existe — ou decidiu fazer um discovery sem avisar.<br><em>Acontece com os melhores projetos.</em></p>
    <a href="/portfolio-simon/" class="btn">← Voltar ao portfólio</a>
  </div>

  <span class="sig">Simon Benlulu · Portfolio</span>

  <script>
    // Gera estrelas aleatórias
    const s=document.getElementById('stars');
    for(let i=0;i<60;i++){
      const el=document.createElement('div');
      const size=Math.random()*3+1;
      el.className='star';
      el.style.cssText=`width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
      s.appendChild(el);
    }
  </script>
</body>
</html>
